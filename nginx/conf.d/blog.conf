# Blog personal generado con Jekyll
server {
    listen 80;
    server_name blog.local;

    root /var/www/blog;
    index index.html;
    absolute_redirect off;

    access_log /var/log/nginx/blog.access.log;
    error_log /var/log/nginx/blog.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
